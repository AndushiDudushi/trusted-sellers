<body data-page="home">

  <main class="relative z-[2]">

    <!-- ============ SEARCH HERO ============ -->
    <section class="border-b hairline">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-3">
        <form id="hero-search-form" class="search-bar search-bar--hero max-w-3xl relative" role="search">
          <span class="w-5 h-5 block shrink-0" style="color:var(--ink-faint)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </span>
          <label for="hero-search-input" class="sr-only">Search products and sellers</label>
          <input id="hero-search-input" type="text" placeholder="Enter product name…" autocomplete="off" />
          <div id="search-pop" class="search-pop" role="listbox" aria-label="Search results"></div>
        </form>

        <!-- Sellers (small circles) -->
        <div id="seller-row" class="cat-row mt-7" aria-label="Shop by seller"></div>

        <!-- Categories under the sellers -->
        <div id="cat-row" class="cat-row border-t hairline pt-4" aria-label="Shop by category"></div>
      </div>
    </section>

    <!-- ============ TRENDING (tabbed grid) ============ -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-2">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <h2 class="section-title text-3xl sm:text-4xl">Trending <em>today</em></h2>
        <div id="grid-tabs" class="tab-row" role="tablist" aria-label="Trending filter">
          <button class="tab-btn is-active" data-tab="Popular" role="tab" aria-selected="true">Popular</button>
          <button class="tab-btn" data-tab="New" role="tab" aria-selected="false">New</button>
          <button class="tab-btn" data-tab="Hot" role="tab" aria-selected="false">Hot</button>
        </div>
      </div>
      <div id="tab-grid"></div>
      <div class="mt-8 text-center">
        <a href="shop.html" class="btn btn-ghost">Browse all products</a>
      </div>
    </section>

    <!-- ============ NEW THIS WEEK (scroll row) ============ -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 pb-2">
      <div class="flex items-end justify-between gap-4 mb-6">
        <h2 class="section-title text-3xl sm:text-4xl reveal">New this <em>week</em></h2>
        <a href="shop.html?tag=New" class="link-line text-sm font-medium reveal" style="color:var(--ink-muted)">View all</a>
      </div>
      <div id="new-row" class="scroll-row"></div>
    </section>

    <!-- ============ TRENDING SELLERS ============ -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 pb-2">
      <div class="flex items-end justify-between gap-4 mb-6">
        <h2 class="section-title text-3xl sm:text-4xl reveal">Trending <em>sellers</em></h2>
      </div>
      <div id="trending-sellers" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </section>

  </main>

  <script src="assets/js/catalog-data.js?v=14"></script>
  <script src="assets/js/galleries.js?v=14"></script>
  <script src="assets/js/bago-catalog.js?v=14"></script>

  <script src="assets/js/app.js?v=14"></script>
</body>
</html>
