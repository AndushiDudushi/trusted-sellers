  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Geist", "ui-sans-serif", "system-ui"],
            display: ["Geist", "ui-sans-serif", "system-ui"],
          },
        },
      },
    };
  </script>

<body data-page="shop">

  <main class="relative z-[2]">

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-2">
      <h1 class="section-title text-3xl sm:text-4xl mb-1">Browse <em>everything</em></h1>
      <p id="shop-query-note" class="text-sm mb-7" style="color:var(--ink-muted)">Every product from all four sellers.</p>

      <div class="flex flex-col gap-3 mb-8">
        <div id="cat-filters" class="cat-row !gap-2 !p-0 !pb-1" role="group" aria-label="Filter by category"></div>
        <div id="subcat-filters" class="cat-row !gap-2 !p-0 !pb-1 hidden" role="group" aria-label="Filter by subcategory"></div>
        <div id="vendor-filters" class="flex flex-wrap gap-2" role="group" aria-label="Filter by seller"></div>
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div id="tag-filters" class="flex flex-wrap gap-2" role="group" aria-label="Filter by tag">
            <button class="filter-pill is-active" data-tag="all">All</button>
            <button class="filter-pill" data-tag="New">New</button>
            <button class="filter-pill" data-tag="Hot">Hot</button>
            <button class="filter-pill" data-tag="Bestseller">Bestsellers</button>
          </div>
          <div class="flex items-center gap-4">
            <span id="shop-count" class="text-xs whitespace-nowrap" style="color:var(--ink-faint)"></span>
            <label for="sort-select" class="sr-only">Sort products</label>
            <select id="sort-select" class="field-input !min-h-[40px] !w-auto !rounded-full text-sm cursor-pointer">
              <option value="featured">Sort: Featured</option>
              <option value="rating">Top Rated</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>
        </div>
      </div>

      <div id="shop-grid"></div>
    </section>

  </main>

  <script src="assets/js/catalog-data.js?v=20"></script>
  <script src="assets/js/galleries.js?v=20"></script>
  <script src="assets/js/pjs-galleries.js?v=20"></script>
  <script src="assets/js/bago-catalog.js?v=20"></script>
  <script src="assets/js/bago-galleries.js?v=20"></script>
  <script src="assets/js/data.js?v=20"></script>
  <script src="assets/js/app.js?v=20"></script>
</body>
</html>
